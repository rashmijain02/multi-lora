[project]
name = "slm-task-models-workshop"
version = "0.1.0"
description = "Workshop 3: distil hosted agent roles into small task models behind parity gates"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
]

[dependency-groups]
train = [
  "torch==2.9.1",
  "transformers==4.57.6",
  "peft==0.18.1",
  "accelerate==1.12.0",
]
dev = ["pytest>=8,<10", "ruff>=0.15,<1"]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
