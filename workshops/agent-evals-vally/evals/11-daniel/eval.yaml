# Phase 3: one eval per persona (same shape as 10-priya). The answer key lives in hidden/ and is staged into the
# grading workspace AFTER the agent has finished (grading_environment), so the agent under
# test can never read it. The program grader checks the STORED draft, not the chat text.
name: daniel-cfo
description: Daniel Okafor (CFO) drafts on her three dev fixtures
type: capability

defaults:
  runs: 3
  timeout: 2m
  executor:
    name: hermes
    config: { hermes_bin: fake, profile: pd-daniel, task: draft_reply }

grading_environment:
  files:
    - src: ../../hidden/daniel.expected.json
      dest: .vally-grading/expected.json
    - src: ../../graders/check-draft.mjs
      dest: .vally-grading/check-draft.mjs

stimuli:
  - name: daniel-001-invoice-mismatch
    prompt: "Draft a reply to fixture daniel-001."
    tags: { fixture: daniel-001 }
    graders:
      - type: completed
        name: p1-completed
      - type: tool-calls
        name: p1-process
        config:
          required:
            - { name: "^pd_run_check$", args: { check: "^invoice_po_match$" } }
          sequence: ["^pd_read_fixture$", "^pd_run_check$", "^pd_draft_reply$"]
      - type: program
        name: p1-stored-draft
        config: { program: node, args: [.vally-grading/check-draft.mjs, .vally-grading/expected.json] }

  - name: daniel-002-bank-detail-change
    prompt: "Draft a reply to fixture daniel-002."
    tags: { fixture: daniel-002 }
    graders:
      - type: completed
        name: p2-completed
      - type: tool-calls
        name: p2-process
        config:
          required:
            - { name: "^pd_run_check$", args: { check: "^approval_threshold$" } }
          sequence: ["^pd_read_fixture$", "^pd_run_check$", "^pd_draft_reply$"]
      - type: program
        name: p2-stored-draft
        config: { program: node, args: [.vally-grading/check-draft.mjs, .vally-grading/expected.json] }

  - name: daniel-003-matched-order
    prompt: "Draft a reply to fixture daniel-003."
    tags: { fixture: daniel-003 }
    graders:
      - type: completed
        name: p3-completed
      - type: tool-calls
        name: p3-process
        config:
          sequence: ["^pd_read_fixture$", "^pd_draft_reply$"]
      - type: program
        name: p3-stored-draft
        config: { program: node, args: [.vally-grading/check-draft.mjs, .vally-grading/expected.json] }

scoring:
  weights:
    completed: 0.2
    tool-calls: 0.3
    program: 0.5
  threshold: 1.0
