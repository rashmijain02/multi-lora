[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leadership-evidence-lab"
version = "0.1.0"
description = "A fictional, evidence-centered empathy modeling workshop"
requires-python = ">=3.11,<3.14"
dependencies = [
    "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
data = [
    "huggingface-hub>=0.34,<1",
    "pyarrow>=18,<24",
]
training = [
    "accelerate==1.12.0",
    "peft==0.18.1",
    "torch==2.10.0",
    "transformers==4.57.6",
]
dev = [
    "ipykernel>=6.29,<8",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
    "pytest>=8,<10",
    "ruff>=0.15,<1",
]

[tool.setuptools.packages.find]
include = ["empathy_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128", extra = "training" }
