[project]
name = "email-reply-workshop"
version = "0.1.0"
description = "Workshop 7: Local email-reply QLoRA SFT and checkpoint-initialized GRPO"
requires-python = ">=3.11,<3.14"
dependencies = [
  "matplotlib>=3.9,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.15,<1"]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["input", "output", "unsloth_compiled_cache"]
